name: Quét danh mục hằng ngày

on:
  schedule:
    # 08:15 giờ Việt Nam (UTC+7) = 01:15 UTC, các ngày thứ 2-6 (trước phiên sáng 9h)
    - cron: "15 1 * * 1-5"
  workflow_dispatch: {}  # cho phép bấm chạy thủ công trên tab Actions

permissions:
  contents: write  # cần quyền ghi để commit lại file kết quả

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Chạy quét
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: python scan_watchlist.py

      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_latest.json
          git diff --staged --quiet || git commit -m "Cập nhật kết quả quét $(date +'%Y-%m-%d %H:%M')"
          git push
