name: Quét danh mục hằng ngày

on:
  schedule:
    - cron: "0 1 * * 1-5"   # 08:00 giờ Việt Nam: chuẩn bị trước phiên
    - cron: "35 4 * * 1-5"  # 11:35 giờ Việt Nam: snapshot giữa phiên
    - cron: "20 8 * * 1-5"  # 15:20 giờ Việt Nam: quét đầy đủ sau phiên
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Kiểm tra nền tảng
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Chạy lượt cập nhật phù hợp
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          UNIVERSE_LIMIT: ${{ vars.UNIVERSE_LIMIT || '120' }}
          DEEP_SCAN_LIMIT: ${{ vars.DEEP_SCAN_LIMIT || '30' }}
          REQUEST_INTERVAL_SECONDS: ${{ vars.REQUEST_INTERVAL_SECONDS || '3.2' }}
          INTRADAY_LIMIT: ${{ vars.INTRADAY_LIMIT || '30' }}
        run: |
          if [ "${{ github.event.schedule }}" = "35 4 * * 1-5" ]; then
            python intraday_update.py
          else
            python scan_market.py
          fi
      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_latest.json paper_trades.json
          git diff --staged --quiet || git commit -m "Cập nhật kết quả quét $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
