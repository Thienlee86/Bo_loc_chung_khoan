name: Quét danh mục hằng ngày

on:
  schedule:
    - cron: "20 9 * * 1-5" # 16:20 giờ Việt Nam, sau phiên giao dịch
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Kiểm tra nền tảng
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Chạy quét
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          UNIVERSE_LIMIT: ${{ vars.UNIVERSE_LIMIT || '120' }}
          DEEP_SCAN_LIMIT: ${{ vars.DEEP_SCAN_LIMIT || '30' }}
          REQUEST_INTERVAL_SECONDS: ${{ vars.REQUEST_INTERVAL_SECONDS || '3.2' }}
        run: python scan_market.py
      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_latest.json paper_trades.json
          git diff --staged --quiet || git commit -m "Cập nhật kết quả quét $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
