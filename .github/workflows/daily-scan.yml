name: Quét danh mục hằng ngày

on:
  schedule:
    - cron: "15 1 * * 1-5" # 08:15 giờ Việt Nam
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Kiểm tra nền tảng
        run: |
          python -m compileall -q .
          python -m pytest -q
      - name: Chạy quét
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: python scan_watchlist.py
      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_latest.json
          git diff --staged --quiet || git commit -m "Cập nhật kết quả quét $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
